# ============================================================
# OneFlesh — Development Docker Compose
# ============================================================
# Starts only backing services (Postgres + Redis).
# API and Web run locally via `npm run dev`.
#
# Usage:
#   docker compose -f infrastructure/docker-compose.dev.yml up -d
#   npm run dev  (from project root)

version: '3.9'

services:
  # ── PostgreSQL (dev) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"   # 5432 is taken by zaneta-postgres; oneflesh uses 5433
    environment:
      POSTGRES_DB: oneflesh_dev
      POSTGRES_USER: oneflesh
      POSTGRES_PASSWORD: oneflesh_dev_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneflesh -d oneflesh_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis (dev) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Mailhog (local email capture) ─────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

  # ── Redis Commander (Redis GUI) ────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
