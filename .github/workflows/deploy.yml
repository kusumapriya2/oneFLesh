# ============================================================
# OneFlesh — Production Deployment
# Triggers on push to main (after CI passes)
# Deploys to Ubuntu VPS via SSH
# ============================================================

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: 'false'
        type: boolean

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          npm run lint
          npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/oneflesh-api:latest
            ${{ secrets.DOCKER_USERNAME }}/oneflesh-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/oneflesh-web:latest
            ${{ secrets.DOCKER_USERNAME }}/oneflesh-web:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/oneflesh

            echo "📥 Pulling latest images..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/oneflesh-api:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/oneflesh-web:latest

            echo "🔄 Running database migrations..."
            docker compose -f infrastructure/docker-compose.yml run --rm api \
              npx prisma migrate deploy

            echo "♻️  Restarting services..."
            docker compose -f infrastructure/docker-compose.yml up -d \
              --no-build \
              --force-recreate \
              --remove-orphans \
              api web

            echo "🔄 Reloading nginx..."
            docker compose -f infrastructure/docker-compose.yml exec nginx \
              nginx -s reload

            echo "🧹 Pruning unused images..."
            docker image prune -f

            echo "✅ Deployment complete!"

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            OneFlesh deployment ${{ job.status == 'success' && '✅ succeeded' || '❌ failed' }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true   # Don't fail deploy if Slack is down
